<div class="profile-page">
  <h3 class="text-2xl font-bold mb-6">My Profile</h3>
  
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="bg-white p-6 rounded shadow">
      <h4 class="text-lg font-semibold mb-4">Personal Information</h4>
      <div class="space-y-3">
        <div>
          <label class="text-sm text-gray-600">Name</label>
          <p class="font-semibold">{{ user.name }}</p>
        </div>
        <div>
          <label class="text-sm text-gray-600">Email</label>
          <p class="font-semibold">{{ user.email }}</p>
        </div>
        <div>
          <label class="text-sm text-gray-600">Phone</label>
          <p class="font-semibold">{{ user.phone }}</p>
        </div>
        <div>
          <label class="text-sm text-gray-600">Member Since</label>
          <p class="font-semibold">{{ user.joinDate }}</p>
        </div>
        <div>
          <label class="text-sm text-gray-600">Role</label>
          <p class="font-semibold">{{ user.role }}</p>
        </div>
      </div>
    </div>

    <div class="bg-white p-6 rounded shadow">
      <h4 class="text-lg font-semibold mb-4">Preferences</h4>
      <div class="space-y-3">
        <label class="flex items-center">
          <input type="checkbox" [checked]="preferences.emailNotifications" class="mr-2" />
          <span>Email Notifications</span>
        </label>
        <label class="flex items-center">
          <input type="checkbox" [checked]="preferences.twoFactorEnabled" class="mr-2" />
          <span>Two-Factor Authentication</span>
        </label>
        <label class="flex items-center">
          <input type="checkbox" [checked]="preferences.newsletter" class="mr-2" />
          <span>Subscribe to Newsletter</span>
        </label>
      </div>
      <button class="mt-4 px-4 py-2 bg-primary text-white rounded hover:bg-opacity-90">
        Save Preferences
      </button>
    </div>
  </div>
</div>
