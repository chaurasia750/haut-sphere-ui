<div class="relative z-[1100]">
  <button
    (click)="toggleDropdown()"
    class="dropdown-toggle flex items-center gap-2.5 rounded-xl px-2 py-1.5 transition-all duration-200 hover:bg-surface-hover group"
  >
    <span class="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[#FFD000] text-sm font-bold text-black shadow-md shadow-[#FFD000]/20">
      {{ displayInitials }}
      <span class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full bg-green-400 ring-2 ring-surface"></span>
    </span>
    <span class="hidden sm:flex flex-col items-start leading-tight">
      <span class="relative group/name">
        <span class="text-sm font-semibold text-primary-fg max-w-[120px] truncate block">{{ displayName }}</span>
        <span class="pointer-events-none absolute top-full left-1/2 z-50 mt-2 -translate-x-1/2 whitespace-nowrap rounded-lg bg-surface-hover px-2.5 py-1 text-xs font-medium text-secondary-fg opacity-0 shadow-lg transition-opacity duration-200 group-hover/name:opacity-100">
          <span class="absolute bottom-full left-1/2 -translate-x-1/2 border-4 border-transparent border-b-surface-hover"></span>
          {{ displayName }}
        </span>
      </span>
      <span class="text-xs text-muted-fg max-w-[120px] truncate">{{ displayLoginId }}</span>
    </span>
    <svg
      [class]="'shrink-0 text-muted-fg transition-transform duration-200 ' + (isOpen ? 'rotate-180' : '')"
      width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  <app-dropdown
    [isOpen]="isOpen"
    (close)="closeDropdown()"
    className="absolute right-0 top-full mt-2 z-[1101] w-[280px] flex flex-col rounded-2xl border border-default bg-surface shadow-modal overflow-hidden"
  >
    <div class="relative bg-surface-hover px-4 py-5">
      <div class="relative flex items-center gap-3">
        <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-[#FFD000]/20 text-lg font-bold text-[#FFD000] ring-2 ring-[#FFD000]/30">
          {{ displayInitials }}
        </div>
        <div class="min-w-0">
          <p class="truncate text-sm font-bold text-primary-fg">{{ displayName }}</p>
          <p class="truncate text-xs text-secondary-fg mt-0.5">{{ displayLoginId }}</p>
        </div>
        <span class="ml-auto flex items-center gap-1 rounded-full bg-green-500/10 px-2 py-0.5 text-[10px] font-semibold text-green-400 ring-1 ring-green-500/30">
          <span class="h-1.5 w-1.5 rounded-full bg-green-400"></span>
          Active
        </span>
      </div>
    </div>

    <div class="mx-3 mt-2 rounded-xl bg-surface-hover border border-default divide-y divide-default">
      <app-dropdown-item-two
        (itemClick)="closeDropdown()"
        tag="a"
        [to]="'/member/view-profile'"
        className="flex items-center gap-3 px-4 py-3 text-sm font-medium text-secondary-fg hover:bg-[#FFD000]/10 hover:text-[#FFD000] transition-colors duration-150 group rounded-t-xl"
      >
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-default text-secondary-fg group-hover:bg-[#FFD000] group-hover:text-black transition-colors">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </span>
        <span>My Profile</span>
        <svg class="ml-auto text-muted-fg group-hover:text-[#FFD000] transition-colors" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </app-dropdown-item-two>

      <app-dropdown-item-two
        (itemClick)="closeDropdown()"
        tag="a"
        [to]="'/member/view-profile'"
        className="flex items-center gap-3 px-4 py-3 text-sm font-medium text-secondary-fg hover:bg-[#FFD000]/10 hover:text-[#FFD000] transition-colors duration-150 group rounded-b-xl"
      >
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-default text-secondary-fg group-hover:bg-[#FFD000] group-hover:text-black transition-colors">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
        <span>Change Password</span>
        <svg class="ml-auto text-muted-fg group-hover:text-[#FFD000] transition-colors" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </app-dropdown-item-two>
    </div>

    <div class="px-3 pt-2 pb-3">
      <a
        href="#"
        (click)="$event.preventDefault(); signOut()"
        class="flex items-center gap-3 w-full rounded-xl px-4 py-3 text-sm font-medium text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-colors duration-150 group"
      >
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-red-500/10 text-red-400 group-hover:bg-red-500/20 transition-colors">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </span>
        Sign out
      </a>
    </div>
  </app-dropdown>
</div>
