<div class="relative z-[1100]">

  <!-- Trigger Button -->
  <button
    (click)="toggleDropdown()"
    class="dropdown-toggle flex items-center gap-2.5 rounded-xl px-2 py-1.5 transition-colors duration-200 hover:bg-gray-100 dark:hover:bg-white/5 group"
  >
    <!-- Avatar with initials -->
    <span class="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 text-sm font-bold text-white shadow-md ring-2 ring-white dark:ring-gray-800">
      {{ displayInitials }}
      <span class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full bg-green-400 ring-2 ring-white dark:ring-gray-800"></span>
    </span>
    <!-- Name + chevron -->
    <span class="hidden sm:flex flex-col items-start leading-tight">
      <!-- Name with tooltip -->
      <span class="relative group/name">
        <span class="text-sm font-semibold text-gray-800 dark:text-white/90 max-w-[120px] truncate block">{{ displayName }}</span>
        <!-- Tooltip -->
        <span class="pointer-events-none absolute top-full left-1/2 z-50 mt-2 -translate-x-1/2 whitespace-nowrap rounded-lg bg-gray-900 px-2.5 py-1 text-xs font-medium text-white opacity-0 shadow-lg transition-opacity duration-200 group-hover/name:opacity-100 dark:bg-gray-700">
          <!-- Arrow -->
          <span class="absolute bottom-full left-1/2 -translate-x-1/2 border-4 border-transparent border-b-gray-900 dark:border-b-gray-700"></span>
          {{ displayName }}
        </span>
      </span>
      <span class="text-xs text-gray-400 dark:text-gray-500 max-w-[120px] truncate">{{ displayLoginId }}</span>
    </span>
    <svg
      [class]="'shrink-0 text-gray-400 transition-transform duration-200 ' + (isOpen ? 'rotate-180' : '')"
      width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  <!-- Dropdown Panel -->
  <app-dropdown
    [isOpen]="isOpen"
    (close)="closeDropdown()"
    className="absolute right-0 top-full mt-2 z-[1101] w-[280px] flex flex-col rounded-2xl border border-gray-100 bg-white shadow-xl dark:border-gray-700 dark:bg-gray-900 overflow-hidden"
  >
    <!-- Header card with gradient -->
    <div class="relative bg-gradient-to-br from-indigo-500 via-violet-500 to-purple-600 px-4 py-5">
      <!-- decorative circles -->
      <span class="absolute -top-4 -right-4 h-24 w-24 rounded-full bg-white/10"></span>
      <span class="absolute top-6 -right-8 h-16 w-16 rounded-full bg-white/10"></span>
      <div class="relative flex items-center gap-3">
        <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-white/20 text-lg font-bold text-white ring-2 ring-white/40 backdrop-blur-sm">
          {{ displayInitials }}
        </div>
        <div class="min-w-0">
          <p class="truncate text-sm font-bold text-white">{{ displayName }}</p>
          <p class="truncate text-xs text-indigo-100 mt-0.5">{{ displayLoginId }}</p>
        </div>
        <span class="ml-auto flex items-center gap-1 rounded-full bg-green-400/20 px-2 py-0.5 text-[10px] font-semibold text-green-300 ring-1 ring-green-400/30">
          <span class="h-1.5 w-1.5 rounded-full bg-green-400"></span>
          Active
        </span>
      </div>
    </div>

    <!-- Menu items -->
    <div class="mx-3 mt-2 rounded-xl bg-white dark:bg-gray-800 shadow-sm border border-gray-100 dark:border-gray-700 divide-y divide-gray-100 dark:divide-gray-700">

      <!-- My Profile -->
      <app-dropdown-item-two
        (itemClick)="closeDropdown()"
        tag="a"
        [to]="'/member/view-profile'"
        className="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors duration-150 group rounded-t-xl"
      >
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-indigo-100 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 group-hover:bg-indigo-200 dark:group-hover:bg-indigo-500/30 transition-colors">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </span>
        <span>My Profile</span>
        <svg class="ml-auto text-gray-300 group-hover:text-indigo-400 transition-colors" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </app-dropdown-item-two>

      <!-- Change Password -->
      <app-dropdown-item-two
        (itemClick)="closeDropdown()"
        tag="a"
        [to]="'/member/view-profile'"
        className="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-violet-50 dark:hover:bg-violet-500/10 hover:text-violet-600 dark:hover:text-violet-400 transition-colors duration-150 group rounded-b-xl"
      >
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-violet-100 dark:bg-violet-500/20 text-violet-600 dark:text-violet-400 group-hover:bg-violet-200 dark:group-hover:bg-violet-500/30 transition-colors">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
        <span>Change Password</span>
        <svg class="ml-auto text-gray-300 group-hover:text-violet-400 transition-colors" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </app-dropdown-item-two>

    </div>

    <!-- Sign Out -->
    <div class="px-3 pt-2 pb-3">
      <a
        href="#"
        (click)="$event.preventDefault(); signOut()"
        class="flex items-center gap-3 w-full rounded-xl px-4 py-3 text-sm font-medium text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 hover:text-red-600 transition-colors duration-150 group"
      >
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-red-100 dark:bg-red-500/20 text-red-500 group-hover:bg-red-200 dark:group-hover:bg-red-500/30 transition-colors">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </span>
        Sign out
      </a>
    </div>

  </app-dropdown>
</div>
