<button
  (click)="toggleTheme()"
  class="relative inline-flex h-10 w-10 items-center justify-center rounded-xl border border-default text-secondary-fg hover:bg-accent/10 hover:text-accent transition-all duration-200"
  [attr.aria-label]="(theme$ | async) === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
>
  @if ((theme$ | async) === 'dark') {
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3c0 0 0 0 0 0A7 7 0 0 0 21 12.79z"></path>
    </svg>
  } @else {
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 3v2M12 19v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M3 12h2M19 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      <circle cx="12" cy="12" r="4"></circle>
    </svg>
  }
</button>
