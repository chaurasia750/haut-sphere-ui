<app-page-breadcrumb pageTitle="Lavel Details" />
<app-distributor-details />

<div
  class="overflow-hidden rounded-2xl border border-gray-200 bg-white pt-4 dark:border-white/[0.05] dark:bg-white/[0.03] mt-6"
>
  <div
    class="flex flex-col gap-4 px-6 mb-4 sm:flex-row sm:items-center sm:justify-between"
  >
    <div>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
        Level Details
      </h3>
    </div>
  </div>

  <div class="max-w-full overflow-x-auto">
    <table class="min-w-full">
      <thead
        class="px-6 py-3.5 border-t border-gray-100 border-y bg-gray-50 dark:border-white/[0.05] dark:bg-gray-900"
      >
        <tr>
          <th
            class="px-6 py-3 font-medium text-gray-500 sm:px-6 text-theme-xs dark:text-gray-400 text-start"
          >
            Level
          </th>
          <th
            class="px-6 py-3 font-medium text-gray-500 sm:px-6 text-theme-xs dark:text-gray-400 text-start"
          >
            No.of Member
          </th>
          <th
            class="px-6 py-3 font-medium text-gray-500 sm:px-6 text-theme-xs dark:text-gray-400 text-start"
          >
            PerId Rate(%)
          </th>
          <th
            class="px-6 py-3 font-medium text-gray-500 sm:px-6 text-theme-xs dark:text-gray-400 text-start"
          >
            Amount (Rs.)
          </th>
        </tr>
      </thead>
      <tbody>
        @for (row of tableRowData; track $index) {
        <tr>
          <td class="px-4 sm:px-6 py-3.5">
            <p class="text-gray-700 text-theme-sm dark:text-gray-400">
              {{ row.level }}
            </p>
          </td>
          <td class="px-4 sm:px-6 py-3.5">
            <p class="text-gray-700 text-theme-sm dark:text-gray-400">
              {{ row.noOfMember }}
            </p>
          </td>
          <td class="px-4 sm:px-6 py-3.5">
            <p class="text-gray-700 text-theme-sm dark:text-gray-400">
              {{ row.perIdRate }}
            </p>
          </td>
          <td class="px-4 sm:px-6 py-3.5">
            <p class="text-gray-700 text-theme-sm dark:text-gray-400">
              {{ row.amount }}
            </p>
          </td>
        </tr>
        }
    </tbody>
    <tfoot class="px-6 py-3.5 border-t border-gray-100 border-y bg-gray-50 dark:border-white/[0.05] dark:bg-gray-900">
          <tr>
              <td colspan="4" class="px-4 sm:px-6 py-3.5">
                  <p class="text-gray-700 text-theme-sm dark:text-gray-400 text-right">
                      Total Amount: <span class="font-bold">3120.00 INR</span>
                  </p>
              </td>
          </tr>
      </tfoot>
    </table>
  </div>
</div>
