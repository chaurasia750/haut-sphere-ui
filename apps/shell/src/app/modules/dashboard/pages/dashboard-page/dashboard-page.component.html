<div class="max-w-5xl mx-auto p-6 md:p-8 space-y-6">
  <div class="rounded-2xl border border-yellow-300 bg-yellow-100 p-6 shadow-sm">
    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">{{ title }}</h2>
        <p class="text-gray-600 mt-1">{{ message }}</p>
      </div>
      <button
        type="button"
        class="inline-flex items-center justify-center rounded-lg bg-yellow-500 px-4 py-2 text-sm font-semibold text-black hover:bg-yellow-600"
        (click)="logout()"
      >
        Logout
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
    <div class="rounded-2xl border border-yellow-300 bg-yellow-100 p-5 shadow-sm">
      <p class="text-xs uppercase tracking-wide text-gray-600">User</p>
      <p class="mt-2 text-lg font-semibold text-gray-800">{{ userId }}</p>
    </div>
    <div class="rounded-2xl border border-yellow-300 bg-yellow-100 p-5 shadow-sm">
      <p class="text-xs uppercase tracking-wide text-gray-600">Role</p>
      <p class="mt-2 text-lg font-semibold text-gray-800">{{ roleName }}</p>
    </div>
    <div class="rounded-2xl border border-yellow-300 bg-yellow-100 p-5 shadow-sm">
      <p class="text-xs uppercase tracking-wide text-gray-600">Session Remaining</p>
      <p class="mt-2 text-lg font-semibold text-gray-800">{{ remainingSeconds }}s</p>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
    <a routerLink="/admin" class="rounded-2xl border border-yellow-300 bg-yellow-100 p-5 shadow-sm hover:border-yellow-500 hover:bg-yellow-200 transition-colors">
      <h3 class="font-semibold text-gray-800">Admin Panel</h3>
      <p class="mt-1 text-sm text-gray-600">Manage system settings and users.</p>
    </a>
    <a routerLink="/member" class="rounded-2xl border border-yellow-300 bg-yellow-100 p-5 shadow-sm hover:border-yellow-500 hover:bg-yellow-200 transition-colors">
      <h3 class="font-semibold text-gray-800">Member Area</h3>
      <p class="mt-1 text-sm text-gray-600">View profile and member modules.</p>
    </a>
    <a routerLink="/management" class="rounded-2xl border border-yellow-300 bg-yellow-100 p-5 shadow-sm hover:border-yellow-500 hover:bg-yellow-200 transition-colors">
      <h3 class="font-semibold text-gray-800">Management</h3>
      <p class="mt-1 text-sm text-gray-600">Review operational and business data.</p>
    </a>
  </div>
</div>
