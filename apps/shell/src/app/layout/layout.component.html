    <button (click)="toggleSidebar()" class="px-4 py-2 bg-secondary rounded">
      {{ sidebarOpen ? 'Hide' : 'Show' }} Menu
    </button>
  </div>
</header>

<div class="flex flex-1">
  <nav class="w-64 bg-gray-100 p-4" *ngIf="sidebarOpen">
    <ul class="space-y-2">
      <li><a href="/dashboard" class="text-primary hover:underline">Dashboard</a></li>
      <li><a href="/admin" class="text-primary hover:underline">Admin</a></li>
      <li><a href="/member" class="text-primary hover:underline">Member</a></li>
      <li><a href="/management" class="text-primary hover:underline">Management</a></li>
    </ul>
  </nav>

  <main class="flex-1 p-6">
    <router-outlet></router-outlet>
  </main>
</div>
