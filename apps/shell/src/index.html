<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Anon India</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet" />
  </head>
  <body>
    <app-root>
      <style>
        .splash-screen {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #ffffff;
          font-family: system-ui, -apple-system, sans-serif;
        }
        .splash-logo {
          width: 120px;
          height: 120px;
          animation: splash-pulse 2s ease-in-out infinite;
        }
        .splash-logo svg { width: 100%; height: 100%; }
        .splash-title {
          margin-top: 24px;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: 3px;
          color: #1e293b;
        }
        .splash-loader {
          margin-top: 32px;
          display: flex;
          gap: 8px;
        }
        .splash-loader span {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #EAB308;
          animation: splash-bounce 1.4s ease-in-out infinite both;
        }
        .splash-loader span:nth-child(1) { animation-delay: -0.32s; }
        .splash-loader span:nth-child(2) { animation-delay: -0.16s; }
        .splash-loader span:nth-child(3) { animation-delay: 0s; }
        @keyframes splash-pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.05); opacity: 0.8; }
        }
        @keyframes splash-bounce {
          0%, 80%, 100% { transform: scale(0.6); }
          40% { transform: scale(1); }
        }
      </style>
      <div class="splash-screen">
        <div class="splash-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="ANON INDIA logo">
            <g fill="#EAB308">
              <polygon points="32,376 210,82 248,82 72,376"/>
              <polygon points="250,82 338,229 294,229 210,82"/>
              <polygon points="230,275 360,275 374,315 216,315"/>
              <polygon points="194,338 404,338 422,376 176,376"/>
            </g>
            <text x="250" y="465" text-anchor="middle" fill="#EAB308" font-family="Times New Roman, Georgia, serif" font-size="66" font-weight="700" letter-spacing="2">ANON INDIA</text>
          </svg>
        </div>
        <div class="splash-title">ANON INDIA</div>
        <div class="splash-loader">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </app-root>
  </body>
</html>
