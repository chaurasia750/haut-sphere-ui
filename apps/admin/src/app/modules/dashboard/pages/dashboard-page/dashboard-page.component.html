<div class="dashboard-page p-6">
  <ui-breadcrumb pageTitle="Admin Dashboard" [items]="breadcrumbItems"/>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div *ngFor="let stat of stats" class="bg-yellow-100 border border-yellow-200 p-6 rounded-lg">
      <p class="text-gray-600 text-sm mb-2">{{ stat.label }}</p>
      <p class="text-2xl font-bold text-gray-800">{{ stat.value }}</p>
    </div>
  </div>
  <div class="mt-8 bg-yellow-100 border border-yellow-200 p-6 rounded-lg">
    <h4 class="text-lg font-semibold mb-4 text-gray-800">Recent Activity</h4>
    <p class="text-gray-600 text-sm">No recent activity to display.</p>
  </div>
</div>
