<div class="dashboard-page">
  <h3 class="text-2xl font-bold mb-6">{{ title }}</h3>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div *ngFor="let stat of stats" class="bg-white p-6 rounded shadow">
      <p class="text-gray-600 text-sm mb-2">{{ stat.label }}</p>
      <p class="text-2xl font-bold text-primary">{{ stat.value }}</p>
    </div>
  </div>
  <div class="mt-8 bg-white p-6 rounded shadow">
    <h4 class="text-lg font-semibold mb-4">Recent Activity</h4>
    <p class="text-gray-500 text-sm">No recent activity to display.</p>
  </div>
</div>
