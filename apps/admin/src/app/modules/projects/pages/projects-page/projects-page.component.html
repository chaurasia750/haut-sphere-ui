<div class="projects-page">
  <ui-breadcrumb pageTitle="Projects" [items]="breadcrumbItems"/>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <p class="text-slate-500 text-sm mb-1">Total Projects</p>
      <p class="text-2xl font-bold text-slate-800">24</p>
    </div>
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <p class="text-slate-500 text-sm mb-1">Active</p>
      <p class="text-2xl font-bold text-emerald-600">18</p>
    </div>
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <p class="text-slate-500 text-sm mb-1">Completed</p>
      <p class="text-2xl font-bold text-blue-600">6</p>
    </div>
  </div>
  <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
    <p class="text-slate-500 text-sm">Project list and management features coming soon.</p>
  </div>
</div>
