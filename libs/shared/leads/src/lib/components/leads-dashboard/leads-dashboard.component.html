<div class="space-y-5">
  <lib-lead-header (addLead)="onAddLead()"/>

  <div class="flex items-center justify-between bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4 shadow-sm">
    <div class="flex items-center gap-2">
      <svg class="h-5 w-5 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span class="text-sm font-medium text-gray-600 dark:text-gray-400">Filter by Date Range</span>
    </div>
    <div class="w-72">
      <shared-date-range-picker
        [startValue]="dateRange.start"
        [endValue]="dateRange.end"
        (valueChange)="onDateRangeChange($event)"
        label=""/>
    </div>
  </div>

  <lib-kpi-cards [cards]="kpiCards"/>

  <lib-recent-leads [leads]="recentLeads"/>
</div>
