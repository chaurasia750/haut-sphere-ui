<div class="mx-auto max-w-3xl">
  <div class="mb-5">
    <h1 class="text-2xl font-bold tracking-tight text-[#111111]">Add New Lead</h1>
    <p class="mt-1 text-sm text-gray-500">CRM / Leads / Add Lead</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">Full Name</label>
        <input type="text" [(ngModel)]="model.name" name="name" required
          class="h-11 w-full rounded-xl border border-gray-200 bg-white px-4 text-sm text-gray-700 placeholder:text-gray-400 focus:border-[#FFC107] focus:outline-none focus:ring-2 focus:ring-[#FFC107]/20"/>
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">Mobile</label>
        <input type="tel" [(ngModel)]="model.mobile" name="mobile" required
          class="h-11 w-full rounded-xl border border-gray-200 bg-white px-4 text-sm text-gray-700 placeholder:text-gray-400 focus:border-[#FFC107] focus:outline-none focus:ring-2 focus:ring-[#FFC107]/20"/>
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">Email</label>
        <input type="email" [(ngModel)]="model.email" name="email"
          class="h-11 w-full rounded-xl border border-gray-200 bg-white px-4 text-sm text-gray-700 placeholder:text-gray-400 focus:border-[#FFC107] focus:outline-none focus:ring-2 focus:ring-[#FFC107]/20"/>
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">Status</label>
        <select [(ngModel)]="model.status" name="status"
          class="h-11 w-full appearance-none rounded-xl border border-gray-200 bg-white px-4 text-sm text-gray-700 focus:border-[#FFC107] focus:outline-none focus:ring-2 focus:ring-[#FFC107]/20 cursor-pointer">
          <option value="new">New</option>
          <option value="hot">Hot</option>
          <option value="warm">Warm</option>
          <option value="cold">Cold</option>
        </select>
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">Assigned To</label>
        <select [(ngModel)]="model.assignedUser" name="assignedUser"
          class="h-11 w-full appearance-none rounded-xl border border-gray-200 bg-white px-4 text-sm text-gray-700 focus:border-[#FFC107] focus:outline-none focus:ring-2 focus:ring-[#FFC107]/20 cursor-pointer">
          <option value="">Select User</option>
          @for (u of assignedUsers; track u) {
            <option [value]="u">{{ u }}</option>
          }
        </select>
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">City</label>
        <select [(ngModel)]="model.city" name="city"
          class="h-11 w-full appearance-none rounded-xl border border-gray-200 bg-white px-4 text-sm text-gray-700 focus:border-[#FFC107] focus:outline-none focus:ring-2 focus:ring-[#FFC107]/20 cursor-pointer">
          <option value="">Select City</option>
          @for (c of cities; track c) {
            <option [value]="c">{{ c }}</option>
          }
        </select>
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">Expected Amount (₹)</label>
        <input type="number" [(ngModel)]="model.expectedAmount" name="expectedAmount"
          class="h-11 w-full rounded-xl border border-gray-200 bg-white px-4 text-sm text-gray-700 placeholder:text-gray-400 focus:border-[#FFC107] focus:outline-none focus:ring-2 focus:ring-[#FFC107]/20"/>
      </div>
      <div class="sm:col-span-2">
        <label class="mb-1.5 block text-sm font-medium text-gray-700">Notes</label>
        <textarea [(ngModel)]="model.notes" name="notes" rows="3"
          class="w-full rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm text-gray-700 placeholder:text-gray-400 focus:border-[#FFC107] focus:outline-none focus:ring-2 focus:ring-[#FFC107]/20"></textarea>
      </div>
    </div>
    <div class="mt-6 flex items-center gap-3 border-t border-gray-100 pt-5">
      <button type="submit"
        class="inline-flex items-center gap-2 rounded-xl bg-[#FFC107] px-6 py-2.5 text-sm font-semibold text-black shadow-lg shadow-[#FFC107]/25 transition-all hover:-translate-y-0.5 hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-[#FFC107] focus:ring-offset-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Save Lead
      </button>
      <button type="button"
        class="inline-flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-6 py-2.5 text-sm font-medium text-gray-600 shadow-sm transition-colors hover:bg-gray-50">
        Cancel
      </button>
    </div>
  </form>
</div>
