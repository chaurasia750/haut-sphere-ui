<div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
  <h3 class="mb-4 text-sm font-semibold text-[#111111]">Recent Leads</h3>
  <div class="space-y-2">
    @for (lead of leads.slice(0, 5); track lead.id) {
      <div class="flex items-center gap-3 rounded-xl border border-gray-50 bg-gray-50/50 px-3 py-2.5 transition-colors hover:bg-gray-100/50">
        <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[#FFC107]/20 text-xs font-bold text-[#111111]">
          {{ initials(lead.name) }}
        </div>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-[#111111]">{{ lead.name }}</p>
          <p class="truncate text-xs text-gray-500">{{ lead.followupDate }}</p>
        </div>
        <span class="shrink-0 rounded-md border px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide"
          [ngClass]="badgeClass[lead.status] || badgeClass['new']">
          {{ lead.status }}
        </span>
        <span class="shrink-0 text-xs font-semibold text-[#111111]">{{ formatCurrency(lead.expectedAmount) }}</span>
      </div>
    }
  </div>
</div>
