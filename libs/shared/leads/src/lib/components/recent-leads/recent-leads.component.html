<div class="rounded-2xl border border-gray-100 bg-white shadow-sm">
  <div class="flex items-center justify-between border-b border-gray-100 px-5 py-4">
    <h3 class="text-sm font-semibold text-[#111111]">Recent Leads</h3>
    <span class="text-xs text-gray-400">{{ leads.length }} total</span>
  </div>
  <div class="divide-y divide-gray-50">
    @for (lead of leads.slice(0, 8); track lead.id; let i = $index) {
      <div class="flex items-center gap-3 px-5 py-3 transition-colors hover:bg-gray-50/60">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-xs font-bold text-[#111111]"
          [ngClass]="avatarColor(i)">
          {{ initials(lead.name) }}
        </div>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-[#111111]">{{ lead.name }}</p>
          <p class="truncate text-xs text-gray-500">{{ lead.followupDate }}</p>
        </div>
        <div class="flex flex-col items-end gap-1">
          <span class="inline-block rounded-md border px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide"
            [ngClass]="badgeClass[lead.status] || badgeClass['new']">
            {{ lead.status }}
          </span>
          <span class="text-xs font-semibold text-[#111111]">{{ formatCurrency(lead.expectedAmount) }}</span>
        </div>
      </div>
    }
  </div>
  @if (leads.length > 8) {
    <div class="border-t border-gray-100 px-5 py-3 text-center">
      <span class="text-xs text-gray-400">+{{ leads.length - 8 }} more leads</span>
    </div>
  }
</div>
