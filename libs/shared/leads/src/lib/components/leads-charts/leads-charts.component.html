<div class="flex flex-col gap-5 lg:flex-row">
  <div class="w-full shrink-0 lg:w-[280px] xl:w-[320px]">
    <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
      <h3 class="mb-4 text-sm font-semibold text-[#111111]">Leads by Status</h3>
      <div class="flex flex-col items-center">
        <svg viewBox="0 0 120 120" class="h-auto w-full max-w-[160px]">
          <circle cx="60" cy="60" r="54" fill="none" stroke="#F0F0F0" stroke-width="12"/>
          @for (seg of donutSegments; track seg.label) {
            <circle cx="60" cy="60" r="54" fill="none"
              [attr.stroke]="seg.color" stroke-width="12"
              [attr.stroke-dasharray]="seg.length + ' ' + (339.292 - seg.length)"
              [attr.stroke-dashoffset]="-seg.offset"
              transform="rotate(-90 60 60)" stroke-linecap="butt"
              style="transition: stroke-dasharray 0.6s ease"/>
          }
          <text x="60" y="56" text-anchor="middle" fill="#111111" font-size="16" font-weight="700">{{ totalLeads }}</text>
          <text x="60" y="72" text-anchor="middle" fill="#999" font-size="9">Total</text>
        </svg>
        <div class="mt-4 grid w-full grid-cols-2 gap-x-4 gap-y-2">
          @for (s of leadStatuses; track s.label) {
            <div class="flex items-center gap-2">
              <span class="h-2.5 w-2.5 shrink-0 rounded-full" [style.background]="s.color"></span>
              <span class="flex-1 text-xs text-gray-500">{{ s.label }}</span>
              <span class="text-xs font-semibold text-[#111111]">{{ s.value }}</span>
            </div>
          }
        </div>
      </div>
    </div>
  </div>

  <div class="min-w-0 flex-1">
    <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
      <div class="mb-4 flex items-center justify-between">
        <h3 class="text-sm font-semibold text-[#111111]">Leads Trend</h3>
        <div class="flex items-center gap-4">
          <span class="flex items-center gap-1.5 text-xs text-gray-500">
            <span class="h-2 w-4 rounded-sm bg-[#FFC107]"></span> Leads
          </span>
          <span class="flex items-center gap-1.5 text-xs text-gray-500">
            <span class="h-2 w-4 rounded-sm bg-[#339AF0]"></span> Conversions
          </span>
        </div>
      </div>
      <div class="relative">
        <svg viewBox="0 0 380 150" class="w-full" style="max-height:180px">
          <defs>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFC107" stop-opacity="0.15"/>
              <stop offset="100%" stop-color="#FFC107" stop-opacity="0.01"/>
            </linearGradient>
          </defs>
          <path [attr.d]="areaPath" fill="url(#areaGrad)"/>
          <path [attr.d]="chartPoints.leads" fill="none" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path [attr.d]="chartPoints.conversions" fill="none" stroke="#339AF0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/>
        </svg>
      </div>
    </div>
  </div>
</div>
