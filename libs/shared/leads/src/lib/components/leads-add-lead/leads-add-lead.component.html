<div class="mx-auto max-w-4xl">
  <!-- Page Header -->
  <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-2xl font-bold tracking-tight text-[#111111]">Add New Lead</h1>
    <nav>
      <ol class="flex items-center gap-1.5 text-sm">
        <li>
          <a routerLink="/admin/leads" class="text-gray-400 transition-colors hover:text-[#FFD000]">Home</a>
          <svg class="mx-1 inline h-3 w-3 text-gray-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/></svg>
        </li>
        <li>
          <a routerLink="/admin/leads/list" class="text-gray-400 transition-colors hover:text-[#FFD000]">Leads</a>
          <svg class="mx-1 inline h-3 w-3 text-gray-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/></svg>
        </li>
        <li class="text-gray-600">Add Lead</li>
      </ol>
    </nav>
  </div>

  <div class="mb-10">
    <lib-lead-stepper [steps]="steps" [currentStep]="currentStep()" />
  </div>

  <!-- Form Card -->
  <div class="rounded-2xl border border-gray-100 bg-white shadow-sm">
    <div class="p-6 sm:p-8">
      <div class="min-h-[380px]">
        @if (currentStep() === 1) {
          <lib-lead-info-form [form]="form"
                              [leadSources]="leadSources"
                              [leadStatuses]="leadStatuses"
                              [assignedUsers]="assignedUsers" />
        }
        @if (currentStep() === 2) {
          <lib-lead-notes-followup-form [form]="form"
                                         [priorities]="priorities"
                                         [availableTags]="availableTags" />
        }
        @if (currentStep() === 3) {
          <lib-lead-review-save-form [form]="form"
                                      [priorities]="priorities" />
        }
      </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-between border-t border-gray-100 px-6 py-4">
      <button type="button" (click)="onCancel()"
              class="inline-flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-5 py-2.5 text-sm font-medium text-gray-600 shadow-sm transition-colors hover:bg-gray-50">
        Cancel
      </button>

      <div class="flex items-center gap-3">
        @if (!isFirstStep()) {
          <button type="button" (click)="previousStep()"
                  class="inline-flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-5 py-2.5 text-sm font-medium text-gray-600 shadow-sm transition-colors hover:bg-gray-50">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
            Previous
          </button>
        }
        @if (!isLastStep()) {
          <button type="button" (click)="nextStep()"
                  class="inline-flex items-center gap-2 rounded-xl bg-[#FFD000] px-6 py-2.5 text-sm font-semibold text-black shadow-lg shadow-[#FFD000]/25 transition-all hover:-translate-y-0.5 hover:shadow-xl">
            Next
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        }
        @if (isLastStep()) {
          <button type="button" (click)="onSubmit()"
                  class="inline-flex items-center gap-2 rounded-xl bg-[#FFD000] px-6 py-2.5 text-sm font-semibold text-black shadow-lg shadow-[#FFD000]/25 transition-all hover:-translate-y-0.5 hover:shadow-xl">
            <svg class="h-4.5 w-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Save Lead
          </button>
        }
      </div>
    </div>
  </div>
</div>
