<div>
  <!-- Search + Filters toggle -->
  <div class="flex items-center gap-3 border-b border-gray-100 px-5 py-3">
    <div class="relative max-w-sm flex-1">
      <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" placeholder="Search leads..." [ngModel]="search" (ngModelChange)="onSearchInput($event)" (keydown.enter)="applyFilters()"
        class="h-10 w-full rounded-xl border border-gray-200 bg-white pl-10 pr-4 text-sm text-gray-700 shadow-sm placeholder:text-gray-400 focus:border-[#FFC107] focus:outline-none focus:ring-2 focus:ring-[#FFC107]/20"/>
    </div>
    <button (click)="toggleFilters()"
      class="inline-flex h-10 shrink-0 items-center gap-2 rounded-xl border border-gray-200 bg-white px-4 text-sm font-medium text-gray-600 shadow-sm transition-colors hover:bg-gray-50 hover:text-gray-800">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/>
      </svg>
      Filters
      <svg class="h-3.5 w-3.5 text-gray-400 transition-transform duration-200" [ngClass]="{'rotate-180': filtersOpen()}"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
  </div>

  <!-- Filter panel -->
  <div class="px-5 py-4" [ngClass]="{'hidden': !filtersOpen()}">
      <div class="grid max-w-lg grid-cols-1 gap-4 sm:grid-cols-2">
        <!-- Status -->
        <div>
          <label class="mb-1.5 block text-xs font-medium text-gray-500">Status</label>
          <shared-lead-status-select [(ngModel)]="statusId" placeholderText="All" theme="light"/>
        </div>

        <!-- Source -->
        <div>
          <label class="mb-1.5 block text-xs font-medium text-gray-500">Source</label>
          <shared-lead-source-select [(ngModel)]="sourceId" placeholderText="All" theme="light"/>
        </div>

        <!-- Assigned To -->
        <div>
          <label class="mb-1.5 block text-xs font-medium text-gray-500">Assigned To</label>
          <shared-user-select [(ngModel)]="assignedUserId" placeholderText="All" theme="light"/>
        </div>

        <!-- Date Range -->
        <div>
          <label class="mb-1.5 block text-xs font-medium text-gray-500">Date Range</label>
          <shared-date-range-picker
            [startValue]="dateFrom" [endValue]="dateTo"
            (valueChange)="onDateRangeChange($event)"
            startPlaceholder="Start" endPlaceholder="End"/>
        </div>
      </div>

      <div class="mt-4 flex items-center gap-3">
        <button (click)="applyFilters()"
          class="inline-flex h-10 items-center gap-1.5 rounded-xl border border-[#FFC107] bg-[#FFC107] px-5 text-sm font-semibold text-black shadow-sm transition-colors hover:bg-[#FFD000]">
          Apply Filters
        </button>
        <button (click)="clearFilters()"
          class="inline-flex h-10 items-center gap-1.5 rounded-xl border border-gray-200 bg-white px-4 text-sm text-gray-500 shadow-sm transition-colors hover:bg-gray-50 hover:text-gray-700">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Reset
        </button>
      </div>
    </div>
</div>
