<div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
  <ui-breadcrumb pageTitle="Leads Dashboard" [items]="breadcrumbItems"/>

  <div class="flex flex-wrap items-center gap-3">
    <div class="relative">
      <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <select [(ngModel)]="dateRange"
        class="h-10 w-44 appearance-none rounded-xl border border-gray-200 bg-white pl-10 pr-8 text-sm text-gray-700 shadow-sm focus:border-[#FFC107] focus:outline-none focus:ring-2 focus:ring-[#FFC107]/20 cursor-pointer">
        <option>Last 7 Days</option>
        <option>Last 30 Days</option>
        <option>Last 90 Days</option>
        <option>This Year</option>
        <option>Custom Range</option>
      </select>
      <svg class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-gray-400" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>

    <shared-user-select [(ngModel)]="selectedUser" placeholderText="All Users" theme="light"/>

    <button (click)="addLead.emit()"
      class="inline-flex items-center gap-2 rounded-xl bg-[#FFC107] px-5 py-2.5 text-sm font-semibold text-black shadow-lg shadow-[#FFC107]/25 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-[#FFC107]/35 focus:outline-none focus:ring-2 focus:ring-[#FFC107] focus:ring-offset-2">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add New Lead
    </button>
  </div>
</div>
