<div class="relative">
  <button
    type="button"
    class="inline-flex items-center gap-2 rounded-lg border border-[#333] px-3 py-2 text-sm text-[#BDBDBD] hover:bg-[#1A1A1A] hover:text-white"
    aria-label="User menu"
    (click)="toggle()"
  >
    <span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-[#FFD000] text-xs font-semibold text-black">
      {{ initials || 'U' }}
    </span>
    <span class="hidden sm:inline">{{ userName }}</span>
  </button>

  @if (isOpen) {
    <div class="absolute right-0 z-[1000000] mt-2 w-56 rounded-xl border border-[#2A2A2A] bg-[#151515] p-2 shadow-lg shadow-black/50">
      <div class="border-b border-[#2A2A2A] px-2 pb-2">
        <p class="text-sm font-semibold text-white">{{ userName }}</p>
        <p class="text-xs text-[#BDBDBD]">{{ userRole }}</p>
      </div>

      <div class="py-1">
        <a routerLink="/profile" class="block rounded-lg px-2 py-2 text-sm text-[#BDBDBD] hover:bg-[#1A1A1A] hover:text-white" (click)="isOpen = false">My Profile</a>
        <a routerLink="/profile" class="block rounded-lg px-2 py-2 text-sm text-[#BDBDBD] hover:bg-[#1A1A1A] hover:text-white" (click)="isOpen = false">Account Settings</a>
        <a routerLink="/" class="block rounded-lg px-2 py-2 text-sm text-red-400 hover:bg-red-500/10" (click)="isOpen = false">Sign Out</a>
      </div>
    </div>
  }
</div>
