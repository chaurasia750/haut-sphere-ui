<div class="relative">
  <button
    type="button"
    class="inline-flex items-center gap-2 rounded-xl border border-default px-3 py-2 text-sm text-secondary-fg hover:bg-surface-hover hover:text-primary-fg transition-colors duration-200"
    aria-label="User menu"
    (click)="toggle()"
  >
    <span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-accent text-xs font-semibold text-black">
      {{ initials || 'U' }}
    </span>
    <span class="hidden sm:inline">{{ userName }}</span>
  </button>

  @if (isOpen) {
    <div class="absolute right-0 z-[1100] mt-2 w-56 rounded-2xl border border-default bg-surface p-2 shadow-modal">
      <div class="border-b border-default px-2 pb-2">
        <p class="text-sm font-semibold text-primary-fg">{{ userName }}</p>
        <p class="text-xs text-secondary-fg">{{ userRole }}</p>
      </div>

      <div class="py-1">
        <a routerLink="/profile" class="block rounded-lg px-2 py-2 text-sm text-secondary-fg hover:bg-surface-hover hover:text-primary-fg transition-colors duration-150" (click)="isOpen = false">My Profile</a>
        <a routerLink="/profile" class="block rounded-lg px-2 py-2 text-sm text-secondary-fg hover:bg-surface-hover hover:text-primary-fg transition-colors duration-150" (click)="isOpen = false">Account Settings</a>
        <a routerLink="/" class="block rounded-lg px-2 py-2 text-sm text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-colors duration-150" (click)="onSignOut()">Sign Out</a>
      </div>
    </div>
  }
</div>
