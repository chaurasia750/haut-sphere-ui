<div class="relative">
  <button
    type="button"
    class="inline-flex items-center gap-2 rounded-lg border border-gray-200 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100"
    aria-label="User menu"
    (click)="toggle()"
  >
    <span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-gray-200 text-xs font-semibold text-gray-700">
      {{ initials || 'U' }}
    </span>
    <span class="hidden sm:inline">{{ userName }}</span>
  </button>

  @if (isOpen) {
    <div class="absolute right-0 z-[1000000] mt-2 w-56 rounded-xl border border-gray-200 bg-white p-2 shadow-lg">
      <div class="border-b border-gray-100 px-2 pb-2">
        <p class="text-sm font-semibold text-gray-900">{{ userName }}</p>
        <p class="text-xs text-gray-500">{{ userRole }}</p>
      </div>

      <div class="py-1">
        <a routerLink="/profile" class="block rounded-lg px-2 py-2 text-sm text-gray-700 hover:bg-gray-50" (click)="isOpen = false">My Profile</a>
        <a routerLink="/profile" class="block rounded-lg px-2 py-2 text-sm text-gray-700 hover:bg-gray-50" (click)="isOpen = false">Account Settings</a>
        <a routerLink="/" class="block rounded-lg px-2 py-2 text-sm text-red-600 hover:bg-red-50" (click)="isOpen = false">Sign Out</a>
      </div>
    </div>
  }
</div>
