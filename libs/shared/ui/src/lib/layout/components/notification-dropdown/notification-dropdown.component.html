<div class="relative">
  <button
    type="button"
    class="relative inline-flex h-10 w-10 items-center justify-center rounded-lg border border-[#333] text-[#BDBDBD] hover:bg-[#1A1A1A] hover:text-white"
    aria-label="Notifications"
    (click)="toggle()"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"></path>
      <path d="M9 17a3 3 0 0 0 6 0"></path>
    </svg>

    @if (unreadCount > 0) {
      <span class="absolute -right-1 -top-1 min-w-5 rounded-full bg-red-500 px-1 text-center text-[10px] font-semibold text-white">
        {{ unreadCount }}
      </span>
    }
  </button>

  @if (isOpen) {
    <div class="absolute right-0 z-[1000000] mt-2 w-72 rounded-xl border border-[#2A2A2A] bg-[#151515] p-2 shadow-lg shadow-black/50">
      <div class="flex items-center justify-between px-2 py-1">
        <h3 class="text-sm font-semibold text-white">Notifications</h3>
        <button
          type="button"
          class="text-xs font-medium text-[#BDBDBD] hover:text-white"
          (click)="markAllRead()"
        >
          Mark all read
        </button>
      </div>

      <ul class="max-h-72 overflow-auto py-1">
        @if (items.length === 0) {
          <li class="px-2 py-6 text-center text-sm text-[#666]">No notifications</li>
        } @else {
          @for (item of items; track item.id) {
            <li>
              <button
                type="button"
                class="w-full rounded-lg px-2 py-2 text-left hover:bg-[#1A1A1A]"
                (click)="markRead(item.id)"
              >
                <div class="flex items-start gap-2">
                  <span class="mt-2 h-2 w-2 rounded-full" [class.bg-[#FFD000]]="!item.read" [class.bg-[#555]]="item.read"></span>
                  <div class="min-w-0">
                    <p class="truncate text-sm" [class.font-semibold]="!item.read" [class.text-white]="!item.read" [class.text-[#BDBDBD]]="item.read">{{ item.title }}</p>
                    <p class="text-xs text-[#666]">{{ item.time }}</p>
                  </div>
                </div>
              </button>
            </li>
          }
        }
      </ul>
    </div>
  }
</div>
