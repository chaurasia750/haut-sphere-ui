<div [formGroup]="formGroup" class="grid grid-cols-1 gap-4 sm:grid-cols-2">

  <!-- Address Line 1 -->
  <div class="relative sm:col-span-2">
    <input
      id="addressLine1"
      type="text"
      formControlName="addressLine1"
      placeholder=" "
      class="peer block w-full appearance-none rounded-xl border border-slate-300 bg-white px-4 pb-2.5 pt-5 text-sm text-slate-900 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
    />
    <label
      for="addressLine1"
      class="pointer-events-none absolute left-4 top-1 z-10 origin-[0] scale-75 text-xs text-slate-500 transition-all duration-200 peer-placeholder-shown:top-3.5 peer-placeholder-shown:scale-100 peer-placeholder-shown:text-sm peer-placeholder-shown:text-slate-400 peer-focus:top-1 peer-focus:scale-75 peer-focus:text-xs peer-focus:text-indigo-600"
    >
      Address Line 1 <span class="text-red-400">*</span>
    </label>
  </div>

  <!-- Address Line 2 -->
  <div class="relative sm:col-span-2">
    <input
      id="addressLine2"
      type="text"
      formControlName="addressLine2"
      placeholder=" "
      class="peer block w-full appearance-none rounded-xl border border-slate-300 bg-white px-4 pb-2.5 pt-5 text-sm text-slate-900 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
    />
    <label
      for="addressLine2"
      class="pointer-events-none absolute left-4 top-1 z-10 origin-[0] scale-75 text-xs text-slate-500 transition-all duration-200 peer-placeholder-shown:top-3.5 peer-placeholder-shown:scale-100 peer-placeholder-shown:text-sm peer-placeholder-shown:text-slate-400 peer-focus:top-1 peer-focus:scale-75 peer-focus:text-xs peer-focus:text-indigo-600"
    >
      Address Line 2
    </label>
  </div>

  <!-- City -->
  <div class="relative">
    <input
      id="city"
      type="text"
      formControlName="city"
      placeholder=" "
      class="peer block w-full appearance-none rounded-xl border border-slate-300 bg-white px-4 pb-2.5 pt-5 text-sm text-slate-900 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
    />
    <label
      for="city"
      class="pointer-events-none absolute left-4 top-1 z-10 origin-[0] scale-75 text-xs text-slate-500 transition-all duration-200 peer-placeholder-shown:top-3.5 peer-placeholder-shown:scale-100 peer-placeholder-shown:text-sm peer-placeholder-shown:text-slate-400 peer-focus:top-1 peer-focus:scale-75 peer-focus:text-xs peer-focus:text-indigo-600"
    >
      City <span class="text-red-400">*</span>
    </label>
  </div>

  <!-- State -->
  <div class="relative">
    <input
      id="state"
      type="text"
      formControlName="state"
      placeholder=" "
      class="peer block w-full appearance-none rounded-xl border border-slate-300 bg-white px-4 pb-2.5 pt-5 text-sm text-slate-900 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
    />
    <label
      for="state"
      class="pointer-events-none absolute left-4 top-1 z-10 origin-[0] scale-75 text-xs text-slate-500 transition-all duration-200 peer-placeholder-shown:top-3.5 peer-placeholder-shown:scale-100 peer-placeholder-shown:text-sm peer-placeholder-shown:text-slate-400 peer-focus:top-1 peer-focus:scale-75 peer-focus:text-xs peer-focus:text-indigo-600"
    >
      State <span class="text-red-400">*</span>
    </label>
  </div>

  <!-- Postal Code -->
  <div class="relative">
    <input
      id="postalCode"
      type="text"
      maxlength="6"
      formControlName="postalCode"
      placeholder=" "
      sharedNumberOnly
      class="peer block w-full appearance-none rounded-xl border border-slate-300 bg-white px-4 pb-2.5 pt-5 text-sm tracking-widest text-slate-900 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
    />
    <label
      for="postalCode"
      class="pointer-events-none absolute left-4 top-1 z-10 origin-[0] scale-75 text-xs text-slate-500 transition-all duration-200 peer-placeholder-shown:top-3.5 peer-placeholder-shown:scale-100 peer-placeholder-shown:text-sm peer-placeholder-shown:text-slate-400 peer-focus:top-1 peer-focus:scale-75 peer-focus:text-xs peer-focus:text-indigo-600"
    >
      Postal Code <span class="text-red-400">*</span>
    </label>
  </div>

  <!-- Country -->
  <div class="relative">
    <input
      id="country"
      type="text"
      formControlName="country"
      placeholder=" "
      class="peer block w-full appearance-none rounded-xl border border-slate-300 bg-white px-4 pb-2.5 pt-5 text-sm text-slate-900 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
    />
    <label
      for="country"
      class="pointer-events-none absolute left-4 top-1 z-10 origin-[0] scale-75 text-xs text-slate-500 transition-all duration-200 peer-placeholder-shown:top-3.5 peer-placeholder-shown:scale-100 peer-placeholder-shown:text-sm peer-placeholder-shown:text-slate-400 peer-focus:top-1 peer-focus:scale-75 peer-focus:text-xs peer-focus:text-indigo-600"
    >
      Country <span class="text-red-400">*</span>
    </label>
  </div>

</div>
