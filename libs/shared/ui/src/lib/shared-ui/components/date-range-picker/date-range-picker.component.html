<div class="flex flex-col gap-1.5">
  @if (label) {
    <label class="text-sm font-medium text-gray-700">{{ label }}</label>
  }
  <div class="flex items-center border border-gray-300 rounded-md bg-gray-50 focus-within:border-blue-500 focus-within:shadow-[0_0_0_3px_rgba(59,130,246,0.1)] transition-all duration-150">
    <div class="flex-1 relative">
      <input
        type="text"
        readonly
        [placeholder]="startPlaceholder"
        [matDatepicker]="startPicker"
        [formControl]="startControl"
        [min]="effectiveMinDate"
        [max]="startMaxDate"
        [class.border-red-500]="startInvalid"
        class="w-full border-0 bg-transparent px-3 py-2 text-sm h-10 cursor-pointer focus:outline-none rounded-l-md"
        (click)="openStartPicker()"
        (blur)="onStartBlur()"
      />
      <button
        type="button"
        class="absolute right-1 top-1/2 -translate-y-1/2 p-1 hover:bg-gray-200 rounded transition-colors"
        (click)="openStartPicker()"
        aria-label="Open start date picker"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h18M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </button>
      <mat-datepicker #startPicker panelClass="custom-datepicker-panel" (closed)="onStartClosed()"></mat-datepicker>
    </div>

    <span class="text-gray-400 shrink-0 px-1 text-sm">—</span>

    <div class="flex-1 relative">
      <input
        type="text"
        readonly
        [placeholder]="endPlaceholder"
        [matDatepicker]="endPicker"
        [formControl]="endControl"
        [min]="endMinDate"
        [max]="effectiveMaxDate"
        [class.border-red-500]="endInvalid"
        class="w-full border-0 bg-transparent px-3 py-2 text-sm h-10 cursor-pointer focus:outline-none rounded-r-md"
        (click)="openEndPicker()"
        (blur)="onEndBlur()"
      />
      <button
        type="button"
        class="absolute right-1 top-1/2 -translate-y-1/2 p-1 hover:bg-gray-200 rounded transition-colors"
        (click)="openEndPicker()"
        aria-label="Open end date picker"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h18M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </button>
      <mat-datepicker #endPicker panelClass="custom-datepicker-panel" (closed)="onEndClosed()"></mat-datepicker>
    </div>

    @if (hasValue()) {
      <button
        type="button"
        (click)="clear()"
        class="shrink-0 p-1.5 mr-1 text-gray-400 hover:text-gray-600 transition-colors rounded hover:bg-gray-200"
        aria-label="Clear date range"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    }
  </div>
  @if (errorMessage) {
    <div class="flex items-center gap-1.5 text-red-500 mt-1">
      <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18.101 12.93a1 1 0 00-1.414-1.414L10 15.585l-6.687-6.687a1 1 0 00-1.414 1.414L8.586 17l6.687 6.687a1 1 0 101.414-1.414L11.414 17l6.687-6.687z" clip-rule="evenodd"/>
      </svg>
      <span class="text-sm font-medium">{{ errorMessage }}</span>
    </div>
  }
</div>
