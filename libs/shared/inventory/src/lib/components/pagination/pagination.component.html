@if (totalPages > 1) {
  <div class="flex items-center justify-between mt-8 pt-6 border-t border-default">
    <p class="text-sm text-muted-fg">Showing page {{ pageIndex }} of {{ totalPages }} ({{ totalCount }} total)</p>
    <div class="flex items-center gap-2">
      <button (click)="goToPage(pageIndex - 1)" [disabled]="pageIndex <= 1"
        class="inline-flex items-center gap-1.5 rounded-xl border border-default bg-surface px-4 py-2 text-sm font-medium text-secondary-fg transition-all hover:bg-surface-hover disabled:opacity-40 disabled:cursor-not-allowed">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        Previous
      </button>
      <button (click)="goToPage(pageIndex + 1)" [disabled]="pageIndex >= totalPages"
        class="inline-flex items-center gap-1.5 rounded-xl border border-default bg-surface px-4 py-2 text-sm font-medium text-secondary-fg transition-all hover:bg-surface-hover disabled:opacity-40 disabled:cursor-not-allowed">
        Next
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>
}
